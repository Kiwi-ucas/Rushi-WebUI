[workspace]
resolver = "2"
members = ["bin/rushi-web", "web-leptos"]
default-members = ["bin/rushi-web"]

[workspace.dependencies]
axum = { version = "0.8", features = ["ws", "query"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
# v0.5.47: compression-br + compression-gzip back the frontend's
# CompressionLayer — the WASM bundle is the whole page load over a slow
# link, and brotli takes it down ~3x (see `serve_frontend`).
tower-http = { version = "0.6", features = ["fs", "cors", "compression-br", "compression-gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# Model settings panel: edits the kernel config.toml in place. toml_edit
# (not toml) because the config is hand-maintained and comment-heavy —
# toml_edit rewrites only the keys it touches and preserves everything
# else byte for byte.
toml_edit = "0.22"
# The panel's "test connection" probe talks to the provider endpoint.
reqwest = { version = "0.13", features = ["json"] }
libc = "0.2"
anyhow = "1"
thiserror = "2"
rust-embed = { version = "8", features = ["include-exclude"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
urlencoding = "2"
chrono = "0.4"
# M9: the session terminal (right-panel terminal tab): a PTY per open
# terminal, spawned in the session's working directory.
portable-pty = "0.8"
# base64-encoding of pty I/O in the terminal WS frames
# (WS text frames carry arbitrary pty bytes).
base64 = "0.22"


[profile.release]
strip = true
lto = true
