[package]
name = "rushi-web-ui"
version = "0.1.0"
edition = "2021"

[lib]
name = "rushi_web_ui"
crate-type = ["cdylib"]

[dependencies]
leptos = { version = "0.7", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fancy-regex = "0.14"
console_error_panic_hook = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
gloo-net = { version = "0.6", features = ["http"] }
web-sys = { version = "0.3", features = [
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "HtmlCollection",
  "Node",
  "NodeList",
  "CssStyleDeclaration",
  "Event",
  "EventTarget",
  "EventInit",
  "EventListenerOptions",
  "AddEventListenerOptions",
  "WebSocket",
  "MessageEvent",
  "CloseEvent",
  "Storage",
  "HtmlTextAreaElement",
  "HtmlSelectElement",
  "HtmlInputElement",
  "HtmlButtonElement",
  "ScrollIntoViewOptions",
  "Location",
  "History",
  "Performance",
  "KeyboardEvent",
  "MouseEvent",
  "ProgressEvent",
  "AbortController",
  "AbortSignal",
  "DomRect",
  "DomRectReadOnly",
  "Selection",
  "MediaQueryList",
  "VisualViewport",
] }
