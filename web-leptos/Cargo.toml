[package]
name = "rushi-web-ui"
version = "0.1.0"
edition = "2021"

[lib]
name = "rushi_web_ui"
crate-type = ["cdylib"]

[dependencies]
leptos = { version = "0.7", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
# v0.5.65: `unbounded_depth` — the History tree nests one `children`
# array per round, so a long single chain (63+ rounds) passes serde_json's
# default 128-level recursion limit and the whole response was rejected.
# See `api::parse_deep`.
serde_json = { version = "1", features = ["unbounded_depth"] }
fancy-regex = "0.14"
console_error_panic_hook = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
# M9: base64 for terminal I/O WS frames (keystrokes / pty output).
base64 = "0.22"
js-sys = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
gloo-net = { version = "0.6", features = ["http"] }
web-sys = { version = "0.3", features = [
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "HtmlCollection",
  "Node",
  "NodeList",
  "CssStyleDeclaration",
  "Event",
  "EventTarget",
  "EventInit",
  "EventListenerOptions",
  "AddEventListenerOptions",
  "WebSocket",
  "MessageEvent",
  "CloseEvent",
  "Storage",
  "HtmlTextAreaElement",
  "HtmlSelectElement",
  "HtmlInputElement",
  "HtmlButtonElement",
  "ScrollIntoViewOptions",
  "Location",
  "History",
  "Performance",
  "KeyboardEvent",
  "MouseEvent",
  "DragEvent",
  "DataTransfer",
  "WheelEvent",
  "TouchEvent",
  "Touch",
  "TouchList",
  "ProgressEvent",
  "AbortController",
  "AbortSignal",
  "DomRect",
  "DomRectReadOnly",
  "Selection",
  "MediaQueryList",
  "VisualViewport",
] }
