<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>rushi web</title>
    <script>
      // v0.5.22: pre-paint theme apply. Runs before first paint so the
      // right <html data-theme> is in place before style.css is
      // computed — no flash of the wrong theme. The Leptos app
      // re-applies the same value on mount and follows OS scheme
      // changes in auto mode (ui::theme_init).
      (function () {
        var m = "auto";
        try { m = localStorage.getItem("rushi-theme") || "auto"; } catch (e) {}
        if (m !== "light" && m !== "dark") m = "auto";
        var eff = m === "auto"
          ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
          : m;
        document.documentElement.setAttribute("data-theme", eff);
      })();
    </script>
    <link data-trunk rel="css" href="style.css" />
    <!-- M9: xterm.js (vendored UMD, exposes `window.Terminal`) + its
         css. Marked data-trunk so Trunk hashes + SRI-stamps them into
         dist/ (xterm-<hash>.js|css), where the rust-embed backend
         serves them. Loaded before the WASM bundle mounts so the
         terminal tab can build on the global. -->
    <link data-trunk rel="css" href="vendor/xterm/xterm.css" />
    <script data-trunk rel="js" src="vendor/xterm/xterm.js"></script>
    <!-- v0.5.33: rust 1.96 emits saturating-float-to-int (i32.trunc_sat_f64)
         + bulk-memory ops; wasm-opt (binaryen ≤ version_123, trunk's
         pinned tool) cannot validate them. Pass the feature gates so a
         truncsat-capable optimizer accepts the build. (Bump trunk's
         wasm-opt tool to ≥ version_130 for a clean toolchain match.) -->
    <link data-trunk rel="rust" data-type="main" data-wasm-opt="z" data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int" />
  </head>
  <body>
    <!-- The app mounts INTO #mount-root (the element stays, its
         contents are appended — so the boot screen lives OUTSIDE it,
         or it would sit above the app forever). -->
    <div id="mount-root"></div>
    <div id="boot">loading…</div>
    <script>
      // Boot screen: removed the moment the WASM app starts.
      //
      // A genuine WASM failure (blocked fetch, 404, bad build,
      // instantiation error) rejects the module-level init promise;
      // surface that immediately instead of waiting for the slow-load
      // timeout. A slow download (a debug WASM over a long-haul link)
      // just takes longer: keep the "loading…" state until the longer
      // timeout so it does not read as a failure.
      var bootFailed = false;
      function showBootError(title, detail) {
        if (window.__rushiMounted || bootFailed) return;
        bootFailed = true;
        var b = document.getElementById('boot');
        if (!b) return;
        b.innerHTML =
          '<div style="text-align:center;color:#e5484d;font:13px system-ui;line-height:1.6">' +
          '<b>' + title + '</b><br>' + detail + '<br><br>' +
          '<button onclick="location.reload()" ' +
            'style="font:13px system-ui;padding:4px 14px;cursor:pointer">' +
            'reload</button></div>';
      }
      addEventListener('TrunkApplicationStarted', function () {
        window.__rushiMounted = true;
        var b = document.getElementById('boot');
        if (b) b.remove();
      });
      addEventListener('unhandledrejection', function (e) {
        if (window.__rushiMounted) return;
        var reason = e.reason;
        var msg = reason ? (reason.message || String(reason)) : 'unknown error';
        showBootError(
          'the app failed to start',
          'the WASM bundle could not load (' + msg + ') — check the ' +
          'console for a fetch or instantiation error'
        );
      });
      setTimeout(function () {
        showBootError(
          'still loading…',
          'the WASM bundle has not finished loading — on a slow ' +
          'connection this can take a while. Check the console for a ' +
          'fetch or instantiation error. Serving the release build ' +
          '(trunk build --release) makes this ~10x smaller'
        );
      }, 30000);
    </script>
  </body>
</html>
